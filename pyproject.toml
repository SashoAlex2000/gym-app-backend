[project]
name = "gym-app-backend"
version = "0.1.0"
description = "Backend for a gym logging app"
readme = "README.md"
authors = [
    { name = "SashoAlex2000", email = "sahooo3@abv.bg" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gym-app-backend = "gym_app_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
